<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тактический планшет — Укрепрайон</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <a class="brand" href="#" id="brand">
      <span class="brand-mark">★</span>
      <span class="brand-text">ТАКТИЧЕСКИЙ ПЛАНШЕТ</span>
    </a>
    <span class="topbar-tag">УКРЕПРАЙОН</span>
  </header>

  <main>
    <!-- Экран 1: вступление -->
    <section id="screen-intro" class="screen active">
      <div class="intro">
        <h1 class="title">ТАКТИЧЕСКИЙ<br>ПЛАНШЕТ</h1>
        <h2 class="subtitle">УКРЕПРАЙОН · МИР ТАНКОВ</h2>
        <p class="lead">
          Простой инструмент для составления тактик на любых картах укрепрайона.
          Выбери карту, расставь позиции и маршруты, продумай план атаки или обороны
          до начала боя.
        </p>
        <button class="btn" id="btn-start" type="button">НАЧАТЬ</button>
      </div>
    </section>

    <!-- Экран 2: выбор карты -->
    <section id="screen-maps" class="screen">
      <div class="maps-head">
        <button class="btn btn-ghost" id="btn-back" type="button">← НАЗАД</button>
        <h2 class="maps-title">ВЫБЕРИ КАРТУ</h2>
      </div>
      <div class="maps-grid" id="maps-grid"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/maps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
